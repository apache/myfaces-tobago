<ui:composition template="/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:tc="http://myfaces.apache.org/tobago/component"
                xmlns:ui="jakarta.faces.facelets">

  <tc:section label="TOBAGO-2543">
    <tc:out id="timestamp" label="Timestamp" value="#{eventController.currentTimestamp}"/>
    <tc:panel id="tobago2543" collapsedMode="hidden">
      <tc:in id="tobago2543Input" value="Content"/>
    </tc:panel>
    <tc:button id="showButton" label="Show" omit="true">
      <tc:operation for="tobago2543" name="show"/>
      <f:ajax render="timestamp tobago2543"/>
    </tc:button>
    <tc:button id="hideButton" label="Hide" omit="true">
      <tc:operation for="tobago2543" name="hide"/>
      <f:ajax render="timestamp tobago2543"/>
    </tc:button>
  </tc:section>
</ui:composition>
