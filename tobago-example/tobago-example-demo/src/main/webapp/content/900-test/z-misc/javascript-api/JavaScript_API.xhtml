<ui:composition template="/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:tc="http://myfaces.apache.org/tobago/component"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
  <tc:script file="javascript-api.js"/>

  <tc:section label="expand/collapse on collapsible components">
    <tc:button id="expandBoxPanelSection" label="Expand box, panel, section" omit="true"/>
    <tc:button id="collapseBoxPanelSection" label="Collapse box, panel, section" omit="true"/>

    <tc:box id="collapsibleBox" label="Box" collapsedMode="hidden">
      <tc:out id="collapsibleBoxContent" value="Content"/>
    </tc:box>
    <tc:panel id="collapsiblePanel" collapsedMode="hidden">
      <tc:out id="collapsiblePanelContent" value="Content"/>
    </tc:panel>
    <tc:section id="collapsibleSection" label="Section" collapsedMode="hidden">
      <tc:out id="collapsibleSectionContent" value="Content"/>
    </tc:section>

    <tc:button id="expandPopup" label="open popup via JavaScript API" omit="true"/>
    <tc:button id="expandOffcanvas" label="open offcanvas via JavaScript API" omit="true"/>

    <tc:popup id="popup" collapsedMode="hidden">
      <tc:out id="popupContent" value="Content"/>
      <tc:button id="collapsePopup" label="close popup via JavaScript API" omit="true"/>
    </tc:popup>
    <tc:offcanvas id="offcanvas" collapsedMode="hidden">
      <tc:out id="offcanvasContent" value="Content"/>
      <tc:button id="collapseOffcanvas" label="close offcanvas via JavaScript API" omit="true"/>
    </tc:offcanvas>
  </tc:section>
</ui:composition>
