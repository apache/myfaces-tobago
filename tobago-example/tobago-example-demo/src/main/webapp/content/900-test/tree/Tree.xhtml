<ui:composition template="/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:tc="http://myfaces.apache.org/tobago/component"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

  <tc:section label="treeSelect without label attribute">
    <tc:segmentLayout medium="7seg 5seg">
      <tc:tree id="treeSelectNoLabel" value="#{treeSelectController.sample}" var="node"
               selectable="#{treeSelectController.selectable}"
               showRoot="true">
        <tc:treeNode>
          <tc:treeIndent/>
          <tc:treeSelect id="select" value="#{node.userObject.selected}"/>
          <tc:link label="#{node.userObject.name}"/>
        </tc:treeNode>
      </tc:tree>
      <tc:panel>
        <tc:box>
          <tc:selectOneRadio value="#{treeSelectController.selectable}">
            <f:ajax render="treeSelectNoLabel"/>
            <tc:selectItems var="mode" value="#{treeSelectController.selectModes}"
                            itemLabel="#{mode.name()}" itemValue="#{mode.name()}"/>
          </tc:selectOneRadio>
        </tc:box>
      </tc:panel>
    </tc:segmentLayout>
  </tc:section>

  <tc:section label="showRoot=true">
    <tc:tree id="treeShowRoot" value="#{treeController.sample}" var="node" showRoot="true">
      <tc:treeNode>
        <tc:treeIndent id="simpleTreeIndent"/>
        <tc:treeLabel value="#{node.userObject.name}"/>
      </tc:treeNode>
    </tc:tree>
  </tc:section>
</ui:composition>
