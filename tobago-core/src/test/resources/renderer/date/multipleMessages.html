   @Test
  public void multipleMessages() throws IOException {
    final UIDate d = (UIDate) ComponentUtils.createComponent(
        facesContext, Tags.date.componentType(), RendererTypes.Date, "id");
    d.setValue(SPUTNIK_LOCAL_DATE);

    d.setValid(false);
    facesContext.addMessage("id",
        new FacesMessage(FacesMessage.SEVERITY_INFO, "test3", "a test3"));
    facesContext.addMessage("id",
        new FacesMessage(FacesMessage.SEVERITY_ERROR, "test", "a test"));
    facesContext.addMessage("id",
        new FacesMessage(FacesMessage.SEVERITY_FATAL, "test2", "a test2"));
    d.encodeAll(facesContext);

    Assertions.assertEquals(loadHtml("renderer/date/multipleMessages.html"), formattedResult());
  }
